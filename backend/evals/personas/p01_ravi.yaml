claims:
  - id: k1
    kind: pattern
    topic: work.focus
    statement: The user loses a planned morning to the first message that arrives.
    rationale: Three mentions on three different days, each about the start of the day.
    evidence: [r3, r13, r23]
    model_confidence: 0.85
    card:
      title: Mornings go to whoever asks first
      body: >-
        You seem to hand the start of the day to whatever has arrived overnight,
        even on the days you had set the time aside. It has come up three times this
        week, each time about the same part of the morning.
      explanation: >-
        Three things you said, on three different days, all about how a planned
        morning went. That is enough to raise, not enough to be certain.

  - id: k2
    kind: preference
    topic: routines.planning
    statement: The user writes the next day's list the evening before.
    rationale: Described twice on different days as the thing that starts a day well.
    evidence: [r7, r17]
    model_confidence: 0.79
    card:
      title: Tomorrow gets written tonight
      body: >-
        It looks like the evening before is when the next day takes shape for you.
        You have mentioned writing it twice this week, both times after the working
        day had ended.
      explanation: >-
        Two things you said on two different days about planning an evening ahead.
        A small observation, offered lightly.

