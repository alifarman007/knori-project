claims:
  - id: k1
    kind: pattern
    topic: work.collaboration
    statement: The user puts their view in writing after a meeting rather than speaking it in the room.
    rationale: Three occasions on three separate days, each about the same choice.
    evidence: [i1, i9, i15]
    model_confidence: 0.86
    card:
      title: The view arrives in writing
      body: >-
        You seem to save what you think for after the meeting, and to put it in
        writing where you can read it back first. It has come up three times, on
        three different days.
      explanation: >-
        Three things you said, on three separate days, all about the same choice
        between the room and the written follow up. Enough to raise, not to be sure.

