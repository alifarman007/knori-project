[project]
name = "knori"
version = "0.1.0"
description = "KnoRI — a chat product that recognises patterns about you, with evidence you can inspect and correct."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.4",
    "argon2-cffi>=23.1",
    "structlog>=25.1",
    "anthropic>=1.0",
    "openai>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "aiosmtplib>=3.0",
    "email-validator>=2.2",
    "python-multipart>=0.0.20",
    "tzdata>=2025.1",  # Windows/slim images have no IANA zone database
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "hypothesis>=6.120",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["knori*", "ros*", "evals*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["knori/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["knori", "ros", "evals"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["knori/db/migrations/", "tests/", "evals/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs a running Postgres (./run db)",
    "live: makes real API calls and spends money (./run live)",
]
filterwarnings = ["ignore::DeprecationWarning"]
