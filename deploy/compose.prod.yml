# KnoRI — production stack for one VPS.
#   docker compose -f deploy/compose.prod.yml --env-file .env up -d
# Images are built by CI and pulled here; the VPS never builds (a Next.js build on a
# 4 GB box competes with Postgres for memory).

name: knori

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      KNORI_DOMAIN: ${KNORI_DOMAIN:?set KNORI_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    restart: unless-stopped

  migrate:
    image: ${KNORI_IMAGE_API:-ghcr.io/knori/api}:${KNORI_TAG:-latest}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: [../.env]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ${KNORI_IMAGE_API:-ghcr.io/knori/api}:${KNORI_TAG:-latest}
    command: ["python", "-m", "uvicorn", "knori.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [../.env]
    environment:
      ENV: prod
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 1500m }
    restart: unless-stopped

  worker:
    image: ${KNORI_IMAGE_API:-ghcr.io/knori/api}:${KNORI_TAG:-latest}
    command: ["python", "-m", "knori.worker"]
    env_file: [../.env]
    environment:
      ENV: prod
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { memory: 1500m }
    restart: unless-stopped

  web:
    image: ${KNORI_IMAGE_WEB:-ghcr.io/knori/web}:${KNORI_TAG:-latest}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${KNORI_DOMAIN}
    deploy:
      resources:
        limits: { memory: 700m }
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-knori}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knori}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    restart: unless-stopped

  # Encrypted dumps every 6 hours, kept locally and pushed to S3-compatible storage.
  backup:
    image: knori/backup:local
    build: { context: ./backup }
    env_file: [../.env]
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
