# KnoRI — production stack for one VPS.
#   docker compose -f deploy/compose.prod.yml --env-file .env up -d
# Images are built by CI and pulled here; the VPS never builds (a Next.js build on a
# 4 GB box competes with Postgres for memory).

name: knori

# ---------------------------------------------------------------- shared fragments

# Pinned here rather than left to .env, because .env.example documents the value a
# developer needs on the host (@localhost:55432) and a .env copied from it points
# every container at its own loopback, where there is no database. Values in
# `environment` win over `env_file`, so a stale line in the file cannot undo this.
x-database-url: &database-url postgresql+asyncpg://${POSTGRES_USER:-knori}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-knori}

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      KNORI_DOMAIN: ${KNORI_DOMAIN:?set KNORI_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    restart: unless-stopped

  migrate:
    image: ${KNORI_IMAGE_API:-ghcr.io/knori/api}:${KNORI_TAG:-latest}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: [../.env]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ${KNORI_IMAGE_API:-ghcr.io/knori/api}:${KNORI_TAG:-latest}
    command: ["python", "-m", "uvicorn", "knori.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [../.env]
    environment:
      ENV: prod
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 1500m }
    restart: unless-stopped

  worker:
    image: ${KNORI_IMAGE_API:-ghcr.io/knori/api}:${KNORI_TAG:-latest}
    command: ["python", "-m", "knori.worker"]
    env_file: [../.env]
    environment:
      ENV: prod
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { memory: 1500m }
    restart: unless-stopped

  web:
    image: ${KNORI_IMAGE_WEB:-ghcr.io/knori/web}:${KNORI_TAG:-latest}
    environment:
      NODE_ENV: production
      # No NEXT_PUBLIC_* here on purpose. Next.js compiles those into the browser
      # bundle, so they are build arguments of frontend/Dockerfile — set by
      # .github/workflows/images.yml when it builds this image — and a value given
      # at run time does nothing at all. Behind Caddy the right value is none: the
      # browser calls /api/v1 on its own origin and the session cookie stays
      # first-party. compose.demo.yml passes NEXT_PUBLIC_SITE_URL the same way,
      # as a build argument, because it builds the image itself.
    deploy:
      resources:
        limits: { memory: 700m }
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-knori}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knori}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    restart: unless-stopped

  # Encrypted dumps every 6 hours, kept locally and pushed to S3-compatible storage.
  backup:
    image: knori/backup:local
    build: { context: ./backup }
    env_file: [../.env]
    # backup.sh turns DATABASE_URL into the PG* variables libpq reads, so it needs
    # the in-network value too.
    environment:
      DATABASE_URL: *database-url
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
