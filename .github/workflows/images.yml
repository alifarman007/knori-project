# Build the api and web images and push them to GHCR.
#
# This is the other half of deploy/compose.prod.yml, which pulls images rather than
# building them (a Next.js build on a 4 GB server competes with Postgres for memory).
# Until this workflow has run at least once there is nothing in the registry and a
# production deploy fails with "manifest unknown".
#
# It runs on a version tag, and by hand from the Actions tab.
#
#   git tag -a v0.1.0 -m "Phase 1 demo" && git push origin v0.1.0
#
# Then on the server, in .env :
#
#   KNORI_IMAGE_API=ghcr.io/<owner>/<repo>/api
#   KNORI_IMAGE_WEB=ghcr.io/<owner>/<repo>/web
#   KNORI_TAG=v0.1.0
#
# The demo path (deploy/compose.demo.yml) does not need this workflow at all: it
# builds both images on the server from the clone that is already there.

name: Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish, e.g. demo"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile
            # backend/Dockerfile needs the repository's config/ directory as a
            # second named context: the application reads config/*.yaml from the
            # repository root. The path is relative to the workspace root.
            build_contexts: config=config
            build_args: GIT_SHA=${{ github.sha }}
          - name: web
            context: frontend
            dockerfile: frontend/Dockerfile
            build_contexts: ""
            # Unset is correct behind Caddy: the browser then calls /api/v1 on its
            # own origin. Set the NEXT_PUBLIC_SITE_URL repository variable to put
            # absolute URLs in the page metadata.
            build_args: NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.build_contexts }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
