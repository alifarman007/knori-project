name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_MODE: fake
  ENV: test

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: knori
          POSTGRES_PASSWORD: knori
          POSTGRES_DB: knori_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knori"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://knori:knori@localhost:5432/knori_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        working-directory: backend
        run: mypy .
      - name: Migrations apply and reverse
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Tests
        working-directory: backend
        run: pytest -q --cov=knori --cov=ros --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint and types
        working-directory: frontend
        run: |
          npm run lint
          npx tsc --noEmit
      - name: Unit tests
        working-directory: frontend
        run: npm run test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - working-directory: backend
        run: pip-audit -r <(pip install -e . --dry-run --report - 2>/dev/null || echo "") || true
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: frontend
        run: npm audit --audit-level=high || true
