# Which model answers which task (plan.md §6.2).
#
# Product code never names a model: it calls `router.run("<task>", ...)` and this
# file decides. Switching a task to GPT is a one-line change here.
#
# Any row can be overridden from the environment with
#   KNORI_ROUTE__<task>=provider:model:effort
# where the task name may use dots or underscores, e.g.
#   KNORI_ROUTE__chat_reply=openai:gpt-5.6-sol:medium
# Empty parts keep the value from this file: `KNORI_ROUTE__chat_reply=::low`.
#
# Rules the router enforces at boot:
#   * max_tokens is never below 2000 — thinking tokens count against it;
#   * Sonnet 5 thinks by default, so every utility task sets `thinking: false`
#     explicitly rather than leaving the field out;
#   * `effort` must be one the chosen provider supports.

defaults:
  provider: anthropic
  thinking: true
  thinking_display: omitted # "summarized" only where the UI shows a thinking state
  effort: medium
  max_tokens: 4000
  stream: false
  cache_ttl: 5m # 1h writes cost 2x input; only worth it above ~2 reads per write
  refusal_fallback: false

tasks:
  # ------------------------------------------------------------------ chat (Opus 5)
  chat.reply:
    model: claude-opus-5
    thinking: true
    thinking_display: summarized
    effort: medium # try `low` after the week-2 measurements
    max_tokens: 8000
    stream: true
    prompt: chat/reply
    prompt_version: 1
    refusal_fallback: true # server-side fallback; llm_calls is priced by the answer

  # --------------------------------------------------- recognition reasoning (Opus 5)
  interpret.recognize:
    model: claude-opus-5
    thinking: true
    effort: high
    max_tokens: 16000
    stream: true # structured via .stream() + get_final_message()
    schema: InterpretationBatch
    prompt: interpret/recognize
    prompt_version: 1

  recognize.compose:
    model: claude-opus-5
    thinking: true
    effort: medium
    max_tokens: 6000
    schema: RecognitionDraft
    prompt: recognize/compose
    prompt_version: 1

  correction.parse:
    model: claude-opus-5
    thinking: true
    effort: medium
    max_tokens: 4000
    schema: CorrectionParse
    prompt: correction/parse
    prompt_version: 1

  claims.same_claim:
    model: claude-opus-5
    thinking: true
    effort: low
    max_tokens: 4000
    schema: SameClaim
    prompt: claims/same_claim
    prompt_version: 1

  # ------------------------------------------------------ background work (Sonnet 5)
  extract.signals:
    model: claude-sonnet-5
    thinking: false
    effort: null
    max_tokens: 6000
    schema: SignalExtraction
    prompt: extract/signals
    prompt_version: 1

  summarize.conversation:
    model: claude-sonnet-5
    thinking: false
    effort: null
    max_tokens: 2000
    schema: ConversationSummary
    prompt: summarize/conversation
    prompt_version: 1

  profile.compile:
    model: claude-sonnet-5
    thinking: true
    effort: medium
    max_tokens: 4000
    schema: ProfileBuild
    prompt: profile/compile
    prompt_version: 1

  chat.opener:
    model: claude-sonnet-5
    thinking: false
    effort: null
    max_tokens: 2000
    prompt: chat/opener
    prompt_version: 1

  chat.title:
    model: claude-sonnet-5
    thinking: false
    effort: null
    max_tokens: 2000
    schema: ChatTitle
    prompt: chat/title
    prompt_version: 1

  onboarding.parse:
    model: claude-sonnet-5
    thinking: false
    effort: null
    max_tokens: 2000
    schema: OnboardingParse
    prompt: onboarding/parse
    prompt_version: 1

  # ------------------------------------------------------------- offline evals only
  "eval.judge_*":
    model: claude-opus-5
    thinking: true
    effort: medium
    max_tokens: 4000

  # ----------------------------------------------------------------------- embeddings
  embed.text:
    kind: embedding
    provider: openai_embeddings
    model: text-embedding-3-small
    dimensions: 1536
    batch_size: 64

# Switching an Opus task to GPT:   provider: openai, model: ${OPENAI_REASONING_MODEL}
# Switching a Sonnet task to GPT:  provider: openai, model: ${OPENAI_BACKGROUND_MODEL}
# Defaults as of 2026-09-19: gpt-5.6-sol ($4/$20) and gpt-5.6-terra ($2/$12).
